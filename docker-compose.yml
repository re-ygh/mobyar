services:
  db:
    image: postgres:16
    container_name: mobyar_db
    environment:
      POSTGRES_USER: mobyar
      POSTGRES_PASSWORD: mobyar
      POSTGRES_DB: mobyar
    volumes:
      - db_data:/var/lib/postgresql/data
      # Auto-run schema/triggers/views/seed on first startup
      - ./sql:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    container_name: mobyar_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://mobyar:mobyar@db:5432/mobyar
      JWT_SECRET_KEY: CHANGE_ME_IN_PRODUCTION
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: mobyar_frontend
    environment:
      # Base URL used by the browser (host machine)
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
